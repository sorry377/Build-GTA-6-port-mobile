name: Overall AI APK Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      # platform-tools is not needed to compile an APK.
      # Install only the compile SDK and matching build tools.
      - name: Install Android compile SDK
        timeout-minutes: 15
        run: |
          sdkmanager --install --verbose \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          if [ ! -f ./gradlew ]; then
            echo "Gradle wrapper is missing; generating Gradle 8.13 wrapper."
            gradle wrapper --gradle-version 8.13
          fi

          test -f ./gradlew || {
            echo "::error::Could not create gradlew"
            exit 1
          }
          chmod +x ./gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace clean :app:assembleDebug

      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OverallAI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
