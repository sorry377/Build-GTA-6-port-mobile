name: Overall AI APK Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android compile SDK
        timeout-minutes: 15
        run: |
          sdkmanager --install --verbose \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      # The source ZIP may place the Android project in ./OverallAI.
      - name: Find Android project directory
        id: project
        shell: bash
        run: |
          SETTINGS_FILE="$(find . -type f -name settings.gradle.kts \
            -not -path './.git/*' \
            -not -path '*/build/*' \
            -not -path '*/.gradle/*' \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE="$(find . -type f -name settings.gradle \
              -not -path './.git/*' \
              -not -path '*/build/*' \
              -not -path '*/.gradle/*' \
              -print -quit)"
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Cannot find settings.gradle.kts or settings.gradle."
            echo "Upload the Overall AI Android project, including settings.gradle.kts and app/."
            echo "Repository files (first 150):"
            find . -maxdepth 4 -type f -not -path './.git/*' | sort | head -150
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "Found Gradle project at: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::Found Gradle settings, but app/build.gradle(.kts) is missing in $PROJECT_DIR"
            exit 1
          fi

      - name: Prepare Gradle wrapper
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          if [ ! -f ./gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Gradle wrapper is missing; generating Gradle 8.13 wrapper."
            gradle wrapper --gradle-version 8.13
          fi

          test -f ./gradlew || {
            echo "::error::Gradle wrapper generation did not create ./gradlew"
            exit 1
          }
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          chmod +x ./gradlew

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew --no-daemon --stacktrace clean :app:assembleDebug

      - name: Verify APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OverallAI-debug-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
