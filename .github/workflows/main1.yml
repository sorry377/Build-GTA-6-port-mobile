name: Build NeonCoast APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # v4 no longer requests the removed Android SDK "tools" package.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$GITHUB_WORKSPACE"
          if [[ -f "$GITHUB_WORKSPACE/NeonCoast.zip" ]]; then
            PROJECT_DIR="$RUNNER_TEMP/NeonCoast"
            rm -rf "$PROJECT_DIR"
            mkdir -p "$PROJECT_DIR"
            unzip -q "$GITHUB_WORKSPACE/NeonCoast.zip" -d "$PROJECT_DIR"
          fi

          if [[ ! -f "$PROJECT_DIR/settings.gradle.kts" || ! -f "$PROJECT_DIR/app/build.gradle.kts" ]]; then
            echo "Android project files were not found in: $PROJECT_DIR"
            echo "Expected settings.gradle.kts and app/build.gradle.kts"
            exit 1
          fi

          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug

          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk \
             "$GITHUB_WORKSPACE/out/NeonCoast.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeonCoast-APK
          path: out/NeonCoast.apk
          if-no-files-found: error
          
